<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="250" fill="#0d1117" />
  
  <!-- Grid Lines (Subtle) -->
  <g stroke="#161b22" stroke-width="2">
    <path d="M0,50 L800,50 M0,100 L800,100 M0,150 L800,150 M0,200 L800,200" />
    <path d="M100,0 L100,250 M200,0 L200,250 M300,0 L300,250 M400,0 L400,250 M500,0 L500,250 M600,0 L600,250 M700,0 L700,250" />
  </g>

  <!-- Glowing Aura behind Logo -->
  <circle cx="150" cy="125" r="80" fill="#3b82f6" opacity="0.15" filter="blur(20px)" />
  <circle cx="170" cy="140" r="60" fill="#8b5cf6" opacity="0.15" filter="blur(20px)" />

  <!-- Isometric Logo -->
  <g transform="translate(150, 125)">
    <!-- Base Cube -->
    <polygon points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.8"/>
    
    <!-- Faces -->
    <polygon points="0,-40 34.64,-20 0,0 -34.64,-20" fill="#3b82f6" opacity="0.2"/>
    <polygon points="0,0 34.64,-20 34.64,20 0,40" fill="#8b5cf6" opacity="0.2"/>
    <polygon points="0,0 -34.64,-20 -34.64,20 0,40" fill="#1e1b4b" opacity="0.4"/>
    
    <!-- DAG Nodes & Edges inside the Cube -->
    <line x1="-15" y1="0" x2="15" y2="-15" stroke="#60a5fa" stroke-width="2" />
    <line x1="15" y1="-15" x2="15" y2="15" stroke="#c084fc" stroke-width="2" />
    <line x1="-15" y1="0" x2="15" y2="15" stroke="#818cf8" stroke-width="2" />
    
    <circle cx="-15" cy="0" r="4" fill="#ffffff" />
    <circle cx="15" cy="-15" r="4" fill="#ffffff" />
    <circle cx="15" cy="15" r="4" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="250" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-2">Isox</text>
  <text x="254" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8b949e" letter-spacing="0.5">Run the graph. Skip the bloat.</text>

  <!-- Code Snippet Box (Decorative) -->
  <g transform="translate(560, 75)">
    <rect width="180" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="20" cy="20" r="5" fill="#ff5f56" />
    <circle cx="35" cy="20" r="5" fill="#ffbd2e" />
    <circle cx="50" cy="20" r="5" fill="#27c93f" />
    <text x="20" y="45" font-family="monospace" font-size="12" fill="#79c0ff">$ isox affected</text>
    <text x="20" y="65" font-family="monospace" font-size="12" fill="#a5d6ff">✔ apps/web</text>
    <text x="20" y="85" font-family="monospace" font-size="12" fill="#a5d6ff">✔ libs/ui</text>
  </g>
</svg>