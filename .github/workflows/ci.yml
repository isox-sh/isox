name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Isox
        uses: ./.github/actions/setup-isox

      - name: Lint
        run: pnpm lint

      - name: Test core through Isox
        run: pnpm isox test core

      - name: Test CLI through Isox
        run: pnpm isox test cli

      - name: Test TypeScript executor through Isox
        run: pnpm isox test js
