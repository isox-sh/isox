  # So we can add branch protection that this one is required
  check:
    name: Shard check
    runs-on: ubuntu-latest
    needs:
      - plan
      - shards
#      - foundation
    if: |
      !cancelled()
    steps:
      - name: Check
        if: |
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled')
        run: echo "Ok"

      - name: Fail
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
