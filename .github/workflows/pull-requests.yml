name: pull-requests

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: pull-requests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      hasPlan: ${{ steps.plan.outputs.hasPlan }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Isox
        uses: ./.github/actions/setup-isox

      - name: Plan affected tests
        id: plan
        uses: ./actions/plan
        with:
          cliPath: dist/cli/index.js
          targets: test,build,lint
          targetOptions: '{"test":{"maxJobs":3,"parallel":1},"build":{"maxJobs":3,"parallel":2},"lint":{"maxJobs":3,"parallel":2}}'

  shards:
    if: needs.plan.outputs.hasPlan == 'true'
    name: Shard ${{ matrix.target }}
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Each isolated worker needs compiled plugins and package dependencies before testing.
      - name: Set up Isox
        uses: ./.github/actions/setup-isox

      - name: Run planned tests
        uses: ./actions/run-many
        with:
          cliPath: dist/cli/index.js
          plan: ${{ toJSON(matrix) }}
          head: ${{ needs.plan.outputs.head }}

  # So we can add branch protection that this one is required
  check:
    name: Distributed check
    runs-on: ubuntu-latest
    needs:
      - plan
      - shards
    if: |
      !cancelled()
    steps:
      - name: Check
        if: |
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled')
        run: echo "Ok"

      - name: Fail
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
